name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
      
      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./frontend/coverage
          slug: Mmmaphefo/sport-coaching-tool
          flags: frontend
          fail_ci_if_error: false

  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      NODE_ENV: test
      # The runner uses Docker host networking, so service containers share
      # the actual host's network directly (no per-job isolation, no NAT).
      # Port 5432 is already taken on that host (most likely by Gitea's own
      # database), so this Postgres instance listens on 5433 instead, and
      # DATABASE_URL/the service command below both point at that port.
      DATABASE_URL: postgresql://test_user:test_password@localhost:5433/sport_coaching_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: sport_coaching_test
          PGPORT: "5433"
        options: >-
          --health-cmd "pg_isready -p 5433"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run migrations
        run: npx node-pg-migrate up --no-check-order

      - name: Run tests with coverage
        run: npm run test:coverage

      # --- Codecov upload -----------------------------------------------------
      # Codecov has no native Gitea integration, so this uploads against a
      # GitHub mirror of this repo instead (see slug below). "directory"
      # (rather than a single "files" path) is used since Vitest's coverage-v8
      # reporter can emit more than one format (e.g. lcov.info + coverage-final.json)
      # depending on vitest.config — pointing at the whole folder lets the
      # action pick up whichever reports exist without needing an exact filename.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./backend/coverage
          slug: Mmmaphefo/sport-coaching-tool
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: https://github.com/christopherHX/gitea-upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: error

      - name: Publish coverage dashboard
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_COVERAGE_SITE_ID: ${{ secrets.NETLIFY_COVERAGE_SITE_ID }}
        # A broken Netlify token — or an unreachable Netlify API from this
        # runner's network — must not fail the whole backend job or hang it
        # indefinitely. The coverage artifact and Codecov upload already
        # succeeded above. "timeout" caps this at 60s so a network issue
        # fails fast with a clear message instead of hanging the job.
        run: |
          timeout 60 npx --yes netlify-cli deploy \
            --dir=coverage \
            --prod \
            --site="$NETLIFY_COVERAGE_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            || echo "::warning::Coverage dashboard deploy failed or timed out — check NETLIFY_AUTH_TOKEN / NETLIFY_COVERAGE_SITE_ID secrets, or whether this runner can reach Netlify's API; dashboard not updated"