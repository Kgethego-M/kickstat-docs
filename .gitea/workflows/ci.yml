name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Start Postgres
        run: |
          docker rm -f pgci || true
          docker run -d --name pgci \
            -e POSTGRES_USER=test_user \
            -e POSTGRES_PASSWORD=test_password \
            -e POSTGRES_DB=sport_coaching_test \
            -p 5432:5432 postgres:16

      - name: Set DATABASE_URL
        run: |
          HOST_IP=$(ip route | awk '/default/ {print $3}')
          echo "Using host IP: $HOST_IP"
          echo "DATABASE_URL=postgresql://test_user:test_password@${HOST_IP}:5432/sport_coaching_test" >> "$GITHUB_ENV"

      - name: Wait for Postgres
        run: |
          node -e "
          const { Client } = require('pg');
          (async () => {
            for (let i = 0; i < 30; i++) {
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              try {
                await client.connect();
                await client.query('SELECT 1');
                await client.end();
                console.log('Postgres is ready');
                process.exit(0);
              } catch (err) {
                console.log('Waiting for Postgres...', err.message);
                await new Promise(r => setTimeout(r, 1000));
              }
            }
            console.error('Postgres did not become ready in time');
            process.exit(1);
          })();
          "

      - name: Run migrations
        run: npx node-pg-migrate up --no-check-order

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          SONAR_TOKEN=$(echo -n "$SONAR_TOKEN" | tr -d '[:space:]')
          SONAR_HOST_URL=$(echo -n "$SONAR_HOST_URL" | tr -d '[:space:]')
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "SonarQube secrets not set; skipping scan"
            exit 0
          fi
          curl -fsSL -o sonar-scanner.zip \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip"
          unzip -q sonar-scanner.zip
          ./sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"
        continue-on-error: true
