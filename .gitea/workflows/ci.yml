name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: sport_coaching_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test_user:test_password@postgres:5432/sport_coaching_test
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Wait for Postgres
        run: |
          node -e "
          const net = require('net');
          const tryConnect = () => new Promise((resolve) => {
            const socket = net.connect(5432, 'postgres', () => {
              socket.end();
              resolve(true);
            });
            socket.on('error', () => resolve(false));
          });
          (async () => {
            for (let i = 0; i < 30; i++) {
              if (await tryConnect()) {
                console.log('Postgres is ready');
                process.exit(0);
              }
              console.log('Waiting for Postgres...');
              await new Promise(r => setTimeout(r, 1000));
            }
            console.error('Postgres did not become ready in time');
            process.exit(1);
          })();
          "

      - name: Run tests (includes migrations against the service container)
        run: npm test