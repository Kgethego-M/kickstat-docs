openapi: 3.0.3
info:
  title: Kickstat API
  description: Sport Coaching Tool API for managing squads, athletes, events, and live match logging.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/squads/mine:
    get:
      summary: Get current user's squad
      tags: [Squads]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Squad details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  coach_id: { type: integer }
                  onboarded: { type: boolean }
                  min_roster_size: { type: integer }
    patch:
      summary: Update squad name
      tags: [Squads]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: Updated squad

  /api/athletes:
    get:
      summary: List all athletes in the squad
      tags: [Athletes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of athletes
    post:
      summary: Add an athlete (coach only)
      tags: [Athletes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                position: { type: string }
                squad_number: { type: integer }
                date_of_birth: { type: string, format: date }
                contact_info: { type: string }
      responses:
        '201':
          description: Athlete created
        '403':
          description: Not authorized (assistant role)

  /api/athletes/{id}:
    patch:
      summary: Update an athlete (coach only)
      tags: [Athletes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Updated athlete
    delete:
      summary: Remove an athlete (coach only)
      tags: [Athletes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Athlete removed

  /api/events:
    get:
      summary: List events (own + joined + open leagues)
      tags: [Events]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of events
    post:
      summary: Create an event or league
      tags: [Events]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Event created

  /api/events/{id}:
    get:
      summary: Event detail with timeline and results
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Event detail
    patch:
      summary: Update event (title, status, etc.)
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Updated event

  /api/events/{id}/logs:
    post:
      summary: Log a live action
      tags: [Live Logging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_type]
              properties:
                action_type: { type: string, enum: [goal, assist, shot_on_target, save, yellow_card, red_card, substitution, penalty] }
                athlete_id: { type: integer, nullable: true }
                minute: { type: integer }
                value: { type: integer, default: 1 }
                notes: { type: string }
      responses:
        '201':
          description: Log entry created
        '400':
          description: Event is cancelled

  /api/events/{id}/logs/{logId}:
    patch:
      summary: Edit a log entry
      tags: [Live Logging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: logId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Updated log entry
    delete:
      summary: Undo (soft-delete) a log entry
      tags: [Live Logging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: logId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Log entry soft-deleted

  /api/fixtures/{id}:
    get:
      summary: Fixture detail with timeline
      tags: [Fixtures]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Fixture detail

  /api/fixtures/{id}/logs:
    post:
      summary: Log a fixture action
      tags: [Fixtures]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '201':
          description: Log entry created

  /api/invites:
    post:
      summary: Create an assistant invite (coach only)
      tags: [Invites]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Invite created

  /api/weather:
    get:
      summary: Get weather forecast for a location
      tags: [External Integrations]
      security:
        - bearerAuth: []
      parameters:
        - name: location
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Weather forecast data

  /api/external/fixtures:
    get:
      summary: Get professional football fixtures
      tags: [External Integrations]
      security:
        - bearerAuth: []
      parameters:
        - name: league
          in: query
          required: true
          schema: { type: string, enum: [PL, PD, BL1, SA, FL1, CL] }
      responses:
        '200':
          description: Fixtures list

  /api/external/standings:
    get:
      summary: Get professional league standings
      tags: [External Integrations]
      security:
        - bearerAuth: []
      parameters:
        - name: league
          in: query
          required: true
          schema: { type: string, enum: [PL, PD, BL1, SA, FL1, CL] }
      responses:
        '200':
          description: League standings

  /api/account/me:
    get:
      summary: Get current user profile
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile with role

  /api/webhooks/clerk:
    post:
      summary: Clerk webhook handler
      tags: [Webhooks]
      description: Receives user.created and user.deleted events from Clerk
      responses:
        '200':
          description: Webhook processed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Clerk JWT token